name: Autonomous Martian Research Loop

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Optional Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Martian Crawler Agent
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python agent_researcher.py

    - name: Commit and Push Synthesized Research Logs
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/research_log_msm.md docs/stats.json docs/*.json || true
        
        # Check if there are changes to commit
        if ! git diff --cached --quiet; then
          git commit -m "chore(auto-agent): sync research epoch and telemetry [skip ci]"
          git push origin main
        else
          echo "No new research findings to commit."
        fi
